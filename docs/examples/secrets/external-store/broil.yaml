secrets:
  store: ../shared-secrets/secrets
  project: app
  identity: alice
  set: dev
  inject: true
  exports:
    APP_MTA_API_KEY: mta_api_key
    APP_API_MAIL_TOKEN: api_mail_token
    APP_API_NOTIFICATIONS_BASIC_AUTH: api_notifications_basic_auth
    APP_API_MONITOR_BASIC_AUTH: api_monitor_basic_auth
    APP_API_SETTINGS_TOKEN: api_settings_token
    APP_SERVICE_API_KEY: service_api_key
    APP_STRIPE_SECRET_KEY: stripe_secret_key
    APP_STRIPE_PRO: stripe_pro
    APP_STRIPE_BASIC: stripe_basic
    APP_GOOGLE_FONTS_API_KEY: google_fonts_api_key
    APP_CLAUDE_API_KEY: claude_api_key
    APP_LITELLM_MASTER_KEY: litellm_master_key
    TELNYX_API_KEY: telnyx_api_key
    VPNBLOCKER_API_KEY: vpnblocker_api_key
    TESTMAIL_PASSWORD: testmail_password
    APP_DB_PASS: db_pass
    REPORTING_DB_PASS: db_pass
    APP_DB_READONLY_PASS: db_readonly_pass
    BLOG_DATABASE_PASSWORD: blog_database_password
    TRACKING_ENCRYPTION_KEY: tracking_encryption_key
    TURN_SECRET: turn_secret
    MOBILE_APP_SECRET: mobile_app_secret
    APP_MONITORING_AUTH: monitoring_auth
    APP_GOOGLE_CLIENT_SECRET: google_client_secret
    APP_GOOGLE_CLIENT_ID: google_client_id
    APP_STRIPE_PUBLIC_KEY: stripe_public_key
    APP_STRIPE_CLIENT_ID: stripe_client_id
    DOCKER_REGISTRY_PASSWORD:
      set: _shared/registry
      key: docker_hub_password
    MYSQL_ROOT_PASSWORD: blog_database_password
    LITELLM_DATABASE_URL:
      template: 'postgresql://app:${db_pass}@db.example.test:5432/app'
environments:
  dev: null
  local:
    secrets:
      set: dev
  ci:
    secrets:
      set: ci
  test:
    secrets:
      set: test
  prod:
    secrets:
      set: prod
