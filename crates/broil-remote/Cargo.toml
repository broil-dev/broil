[package]
name = "broil-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
ssh-hardening-guard = []
ssh-vendor-candidate = []
remote-ssh-bootstrap-live = []
remote-trust-live = []

[dependencies]
broil-secrets = { path = "../broil-secrets" }
broil-config = { path = "../broil-config" }
broil-core = { path = "../broil-core" }
data-encoding = "=2.11.1"
getrandom = { version = "=0.4.3", features = ["std"] }
hmac = "=0.13.0"
russh = { path = "../vendor/russh-0.62.5", version = "=0.62.5", default-features = false, features = ["ring"] }
russh-sftp = "=2.4.0"
rustix = { version = "=1.1.4", features = ["fs", "process", "pty", "termios"] }
sha1 = "=0.11.0"
sha2 = "=0.11.0"
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
zeroize = "=1.9.0"

[dev-dependencies]
log = "=0.4.33"
tempfile.workspace = true
tokio = { version = "=1.53.3", features = ["test-util"] }

