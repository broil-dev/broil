[package]
name = "broil-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bech32 = { version = "=0.11.1", default-features = false }
getrandom = { version = "=0.4.3", features = ["std"] }
rustix = { version = "=1.1.4", features = ["fs", "process", "termios"] }
zeroize = "=1.9.0"

[dev-dependencies]
rustix = { version = "=1.1.4", features = ["pty"] }
