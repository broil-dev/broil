[package]
name = "broil-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
interop = []
vault-live = []

[dependencies]
broil-core = { path = "../broil-core" }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "=0.8.4"
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { version = "=1.53.3", features = ["rt", "net", "io-util", "time", "signal", "process", "macros"] }
rustix = { version = "=1.1.4", features = ["fs", "process"] }
saphyr-parser = { path = "../vendor/saphyr-parser-0.0.11", version = "=0.0.11" }
aes-gcm = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
aes = { version = "=0.9.2", features = ["zeroize"] }
ghash = { version = "=0.6.0", features = ["zeroize"] }
regex = { path = "../vendor/regex-1.13.1", version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-gencat", "unicode-perl", "unicode-script"] }
semver = "=1.0.28"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
base64ct = { version = "=1.8.3", default-features = false }
bech32 = { version = "=0.11.1", default-features = false }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
curve25519-dalek = { version = "=5.0.0", default-features = false, features = ["zeroize"] }
getrandom = "=0.4.3"
hkdf = "=0.13.0"
hmac = { version = "=0.13.0", features = ["zeroize"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
poly1305 = { version = "=0.9.1", features = ["zeroize"] }
salsa20 = { version = "=0.11.0", features = ["zeroize"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
zeroize = "=1.9.0"

[dev-dependencies]
saphyr-parser = { path = "../vendor/saphyr-parser-0.0.11", features = ["wipe-observer", "debug_prints"] }
scrypt = { version = "=0.12.0", default-features = false }
tempfile.workspace = true
